# Render Blueprint: one Docker web service, no database add-on.
# Uses the same container as deploy/huggingface/Dockerfile: the catalogue is read-only reference data
# seeded at start-up into a throw-away SQLite file, and SECRET_KEY is generated per start.
# Free plans sleep after idle time; check plan limits on render.com before deploying.
services:
  - type: web
    name: tripnest-ai
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/huggingface/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PHOTO_PROVIDER
        value: wikimedia
      - key: APP_TZ
        value: Asia/Kolkata
