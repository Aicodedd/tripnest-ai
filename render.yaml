# Render Blueprint: one Docker web service + one PostgreSQL database.
# Check plan names and limits on render.com before deploying; free plans sleep and may expire.
services:
  - type: web
    name: tripnest-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tripnest-db
          property: connectionString
      - key: PHOTO_PROVIDER
        value: wikimedia
      - key: WIKIMEDIA_CONTACT
        sync: false   # your GitHub URL or email; Wikimedia blocks clients that do not identify themselves
      - key: APP_TZ
        value: Asia/Kolkata
databases:
  - name: tripnest-db
    plan: free
    databaseName: tripnest
